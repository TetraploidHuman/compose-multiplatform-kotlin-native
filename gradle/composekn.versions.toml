[versions]
composekn = "0.5.68"
kotlin = "2.4.0"
compose-ui = "1.12.1"
compose-ui-published = "1.12.1-ckn.0.5.68"
compose-maven-deps = "1.11.1"
coroutines = "1.10.2"

[libraries]
composekn-bom = { module = "com.tetraploid:compose-kn-bom", version.ref = "composekn" }
composekn-linux = { module = "com.tetraploid:compose-kn-linux", version.ref = "composekn" }
composekn-windows = { module = "com.tetraploid:compose-kn-windows", version.ref = "composekn" }
composekn-resources = { module = "com.tetraploid:compose-kn-resources", version.ref = "composekn" }
composekn-skiko = { module = "com.tetraploid:skiko", version.ref = "composekn" }
composekn-compose-ui = { module = "com.tetraploid.compose:ui", version.ref = "compose-ui-published" }
composekn-compose-foundation = { module = "com.tetraploid.compose:foundation", version.ref = "compose-ui-published" }
composekn-compose-material3 = { module = "com.tetraploid.compose:material3", version.ref = "compose-ui-published" }

[plugins]
# 推荐入口
composekn = { id = "com.tetraploid", version.ref = "composekn" }
composekn-app = { id = "com.tetraploid.app", version.ref = "composekn" }
# 兼容旧 ID
composekn-host = { id = "com.tetraploid.host", version.ref = "composekn" }
composekn-resources = { id = "com.tetraploid.resources", version.ref = "composekn" }
composekn-settings = { id = "com.tetraploid.settings", version.ref = "composekn" }
